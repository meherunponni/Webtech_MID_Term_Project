<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create an Account — Localnest</title>
  <link rel="stylesheet" href="css/style.css" />

  <style>
    body.auth-page {
      background-color: #F4F7FB;
    }

    .auth-header {
      background-color: #FFFFFF;
      border-bottom: 1px solid #E2E8F0;
    }

    .auth-header-link {
      color: #2563EB;
    }

    .auth-card {
      background-color: #FFFFFF;
      border: 1px solid #E2E8F0;
      box-shadow: 0 8px 30px rgba(15, 23, 42, 0.06);
    }

    .auth-title {
      color: #1E3A5F;
    }

    .auth-subtitle {
      color: #64748B;
    }

    .form-label {
      color: #334155;
    }

    .form-control {
      background-color: #FFFFFF;
      color: #1E293B;
      border: 1px solid #CBD5E1;
    }

    .form-control:focus {
      border-color: #2563EB;
      outline: none;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .btn-primary {
      background-color: #2563EB;
      color: #FFFFFF;
      border: 1px solid #2563EB;
    }

    .btn-primary:hover {
      background-color: #1D4ED8;
      border-color: #1D4ED8;
    }

    .auth-footer-text {
      color: #64748B;
    }

    .auth-footer-text a {
      color: #2563EB;
    }
  </style>
</head>

<body class="auth-page" data-page="register">

  <header class="auth-header">
    <a href="index.html" class="brand-logo">
      <span class="brand-logo-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-9.5z"/>
          <path d="M9 21V13h6v8"/>
        </svg>
      </span>
      <span>localnest</span>
    </a>
    <a href="index.html" class="auth-header-link">Back to Home</a>
  </header>

  <main class="auth-main">
    <section class="auth-card auth-card-wide" aria-labelledby="registerHeading">
      <h1 id="registerHeading" class="auth-title">Create an Account</h1>
      <p class="auth-subtitle">Join as a Traveler, Host, or Local Tour Guide</p>

      <div id="registerStatusBanner" class="status-banner" style="display: none;" role="alert"></div>

      <form id="registerForm" novalidate>
        <div class="form-group">
          <label for="regFullName" class="form-label">Full Name</label>
          <input
            type="text"
            id="regFullName"
            name="full_name"
            class="form-control"
            placeholder="Enter your full name"
            required
          />
        </div>

        <div class="form-group">
          <label for="regEmail" class="form-label">Email Address</label>
          <input
            type="email"
            id="regEmail"
            name="email"
            class="form-control"
            placeholder="Enter your email address"
            required
          />
        </div>

        <div class="form-group">
          <label for="regRole" class="form-label">Select Your Role</label>
          <select id="regRole" name="role" class="form-control" required>
            <option value="Traveler">Traveler (Guest)</option>
            <option value="Host">Host (Homestay Owner)</option>
            <option value="Guide">Local Tour Guide</option>
          </select>
        </div>

        <div class="form-row-2">
          <div class="form-group">
            <label for="regPassword" class="form-label">Password</label>
            <input
              type="password"
              id="regPassword"
              name="password"
              class="form-control"
              placeholder="Create a password"
              required
            />
          </div>

          <div class="form-group">
            <label for="regConfirmPassword" class="form-label">Confirm Password</label>
            <input
              type="password"
              id="regConfirmPassword"
              name="confirm_password"
              class="form-control"
              placeholder="Confirm password"
              required
            />
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block" style="margin-top: 4px;">
          Create Account
        </button>
      </form>

      <p class="auth-footer-text">
        Already have an account? <a href="login.html">Log in</a>
      </p>
    </section>
  </main>

  <script src="js/main.js"></script>
</body>
</html>
